# Pin the compose project name so container/volume names stay stable
# regardless of the checkout folder name (brand is "nexus").
name: nexus

services:
  postgres:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus}
      POSTGRES_USER: ${DB_USER:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexus} -d ${DB_NAME:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: realtime (WebSocket) needs Redis. Set REDIS_URL=redis://localhost:6379/1 for the
  # API and the uvicorn process; without it the app keeps polling.
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: nexus-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional (profile "storage"): an S3-compatible object store for trying STORAGE_BACKEND=s3
  # locally. SeaweedFS stands in for MinIO because MinIO no longer publishes pullable community
  # images. Development only: the credentials in docker/seaweedfs-s3.json are fake, anonymous
  # users may read objects (never list them), and data lives in a throwaway volume.
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: nexus-s3
    profiles: ["storage"]
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port=8333
      - -master.volumeSizeLimitMB=256
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - nexus_s3data:/data
    restart: unless-stopped

volumes:
  nexus_pgdata:
  nexus_s3data:
