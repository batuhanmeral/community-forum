# Scanner images (SEMGREP_IMAGE, ZIZMOR_IMAGE, GITLEAKS_IMAGE, TRIVY_IMAGE,
# ZAP_IMAGE) live in workflow env vars, which Dependabot cannot update: its
# github-actions ecosystem only reads `uses:`, and its docker/docker-compose
# ecosystems only read Dockerfiles and compose files. Update them by hand:
#   1. Find the new tag on the image's release page or registry. Wait about a
#      week after release, as the Dependabot cooldown does.
#   2. Get the digest of the multi-arch index:
#        docker buildx imagetools inspect <image>:<tag>
#      Use the top-level "Digest: sha256:..." line, not a per-platform one.
#   3. Replace both the tag and the digest on the env line here:
#        <image>:<tag>@sha256:<digest>
#   4. Run the scanner locally with the new image, then copy the same line to
#      the other repos that use this template.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: new CVEs get published against unchanged code.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PRs cancel superseded runs; every main/scheduled run completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Scanners run from images pinned by digest; bump tag and digest together.
env:
  SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

jobs:
  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One run: text findings in the log and a SARIF copy in the workspace.
      # --error keeps the exit code; the SARIF copy does not change it.
      - name: Semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics off --error --sarif-output=semgrep.sarif
          --config p/django --config p/python --config p/typescript
          --config p/react --config p/dockerfile
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          # Online audits: impostor commits and known-vulnerable actions.
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/src:ro" "$ZIZMOR_IMAGE" /src
      # Handed to sast-upload, so the scanners never see a write token.
      # Also kept when Semgrep fails; skipped for fork PRs (no upload there).
      - name: Keep Semgrep SARIF
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 5

  # Uploads the SARIF from sast to code scanning. No checkout, no scanners:
  # the write token only meets the two pinned actions below. Runs when sast
  # failed on findings; skipped on cancel and on PRs from forks or deleted
  # head repos, whose token is read-only.
  sast-upload:
    name: sast-upload
    needs: sast
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Downloading an artifact of the same run needs no token permission.
    # Private repos also need contents: read for upload-sarif.
    permissions:
      security-events: write # upload-sarif writes the Semgrep analysis to code scanning.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: semgrep-sarif
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vulnerable dependencies
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE"
          fs --scanners vuln --include-dev-deps --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .
      - name: Dockerfile misconfigurations
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE"
          config --severity CRITICAL,HIGH --exit-code 1 .

  # Fails a PR that adds a dependency with a known HIGH or CRITICAL advisory.
  # Trivy above checks the whole lockfile; this shows the PR's own diff.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Throwaway secrets for the scan stack
        run: |
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
      - name: Build and start the prod stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          for image in nexus-backend nexus-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache" \
              -v "$PWD/sbom:/sbom" "$TRIVY_IMAGE" image --format cyclonedx --output "/sbom/$image.cdx.json" "$image"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
      - name: Vulnerable image packages
        run: |
          for image in nexus-backend nexus-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache" \
              "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$image"
          done
      # The scan stack is plain HTTP; real prod redirects to HTTPS behind TLS.
      - name: Django deploy checks
        run: >-
          docker compose -f docker-compose.prod.yml exec -T -e SECURE_SSL_REDIRECT=True backend
          python manage.py check --deploy --fail-level WARNING
      # Gate per .github/zap/rules.tsv: FAIL and unlisted (WARN) rules fail the job;
      # known, deferred alerts are INFO and stay in the report only.
      - name: ZAP baseline
        run: |
          mkdir -p zap && chmod 777 zap
          cp .github/zap/rules.tsv zap/rules.tsv
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost -c rules.tsv -r zap-report.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: zap-report
          path: zap/zap-report.html
