name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep the scanner identical to security.yml; bump tag and digest together.
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  release:
    name: release-${{ matrix.component }}
    # Manual runs are limited to main; tag runs are further checked against main below.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # Checkout the tagged commit (or selected manual ref).
      packages: write # Publish images, provenance, SBOMs and signatures to GHCR.
      id-token: write # Keyless Sigstore signing and provenance attestation.
      attestations: write # Record build provenance in the GitHub attestation API.
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        shell: bash
    env:
      IMAGE_COMPONENT: ${{ matrix.component }}
    steps:
      # The runner context is not available in jobs.<id>.env, so the private
      # Docker config path is exported for every later step here instead.
      - name: Docker config directory
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/release-docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the release commit can be checked against origin/main.
          fetch-depth: 0
          persist-credentials: false
      - name: Require commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not on main." >&2
            exit 1
          fi
      - name: Image reference
        id: reference
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexus-$IMAGE_COMPONENT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[A-Za-z0-9_.-]*$ || ${#tag} -gt 128 ]]; then
              echo 'Release tag must start with v and be a valid Docker tag.' >&2
              exit 1
            fi
          else
            tag="run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          printf 'image=%s\ntag=%s\n' "$image" "$tag" >> "$GITHUB_OUTPUT"
      - name: Build image without cache
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          TAG: ${{ steps.reference.outputs.tag }}
        run: |
          docker build --pull --no-cache \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$TAG" "$IMAGE_COMPONENT"
      - name: Scan image
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          TAG: ${{ steps.reference.outputs.tag }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 "$IMAGE:$TAG"
      - name: CycloneDX SBOM
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          TAG: ${{ steps.reference.outputs.tag }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/sbom" "$TRIVY_IMAGE" image --format cyclonedx \
            --output /sbom/sbom.cdx.json "$IMAGE:$TAG"
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish image
        id: publish
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          TAG: ${{ steps.reference.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' \
            | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.reference.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          # Storage records need additional permissions; provenance does not.
          create-storage-record: false
      - name: Attest SBOM and sign image
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verification summary
        env:
          IMAGE: ${{ steps.reference.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          {
            printf '## %s\n\nDigest: `%s`\n\n```bash\n' "$IMAGE" "$DIGEST"
            printf 'gh attestation verify "oci://%s@%s" --repo "%s" --cert-identity "%s"\n' \
              "$IMAGE" "$DIGEST" "$GITHUB_REPOSITORY" "$identity"
            printf 'cosign verify --certificate-identity "%s" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "%s@%s"\n' \
              "$identity" "$IMAGE" "$DIGEST"
            printf 'cosign verify-attestation --type cyclonedx --certificate-identity "%s" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "%s@%s"\n' \
              "$identity" "$IMAGE" "$DIGEST"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: ${{ always() }}
        run: |
          docker logout ghcr.io
          rm -rf "$DOCKER_CONFIG"
