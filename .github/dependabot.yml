version: 2

# Weekly batches; the cooldown skips releases younger than a week, so a
# hijacked release has time to be yanked before it reaches a PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # @types/node tracks the runtime Node line; typescript-eslint does not support TS 7 yet.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Node majors include non-LTS lines; move between LTS releases by hand.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
