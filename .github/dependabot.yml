version: 2

# Weekly batches; the cooldown skips releases younger than a week, so a
# hijacked release has time to be yanked before it reaches a PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
    # Majors need code changes; take them by hand. Security updates still open PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Majors need code changes; take them by hand. Security updates still open PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Majors (Node, Python, nginx) need code changes; take them by hand.
    # Security updates still open PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A PostgreSQL major needs dump/restore; take it by hand. Security updates still open PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
