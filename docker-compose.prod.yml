# Production-ish stack: Postgres + Django (gunicorn) + React (nginx).
# Copy .env.prod.example to .env and fill in real secrets before running:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: nexus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus}
      POSTGRES_USER: ${DB_USER:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexus} -d ${DB_NAME:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      # The demo stack is plain HTTP; terminate TLS at an edge proxy in real prod.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      DB_NAME: ${DB_NAME:-nexus}
      DB_USER: ${DB_USER:-nexus}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - nexus_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - nexus_media:/usr/share/nginx/media:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nexus_pgdata:
  nexus_media:
