# Production-ish stack: Postgres + Redis + Django (gunicorn API, uvicorn realtime) + React (nginx).
# Copy .env.prod.example to .env and fill in real secrets before running:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: nexus

services:
  postgres:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus}
      POSTGRES_USER: ${DB_USER:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexus} -d ${DB_NAME:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    # Cache, throttle counters, socket tickets and the realtime channel layer (db 2): eviction
    # beats OOM. A dropped realtime event only delays an update; clients resync over REST.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: &backend-image nexus-backend
    build: ./backend
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      # The demo stack is plain HTTP; terminate TLS at an edge proxy in real prod.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-True}
      DB_NAME: ${DB_NAME:-nexus}
      DB_USER: ${DB_USER:-nexus}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      REDIS_URL: redis://redis:6379/1
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-30}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Nexus <noreply@localhost>}
      # nginx only = 1; add 1 for every extra proxy (e.g. a TLS edge) in front of it.
      NUM_PROXIES: ${NUM_PROXIES:-1}
      # Empty keeps two-step verification off. Comma separate keys to rotate.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_ISSUER: ${MFA_ISSUER:-Nexus}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-False}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Media storage: filesystem (the nexus_media volume) or s3 (external S3/R2 bucket + CDN).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
    volumes:
      - nexus_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': 'backend'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: *backend-image
    environment:
      <<: *backend-environment
      WORKER_READY_FILE: /tmp/db-worker.ready
    # Bypass the web entrypoint: only backend owns migrations.
    entrypoint: ["./worker-entrypoint.sh"]
    command: ["python", "manage.py", "db_worker", "--no-reload"]
    healthcheck:
      test: ["CMD", "python", "-m", "config.worker_health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    # db_worker finishes its current task on SIGTERM.
    stop_grace_period: 60s
    restart: unless-stopped

  realtime:
    image: *backend-image
    environment: *backend-environment
    # Bypass the web entrypoint: only backend owns migrations.
    entrypoint: []
    # WebSocket event stream (config/asgi.py). Not published: nginx proxies /ws/ here.
    # Proxy headers stay off: the realtime path never uses the client address or scheme.
    # Clients only send small auth/ping frames, hence the 4 KiB cap.
    command:
      - uvicorn
      - config.asgi:application
      - --host=0.0.0.0
      - --port=8001
      - --no-proxy-headers
      - --no-server-header
      - --lifespan=off
      - --ws=websockets-sansio
      - --ws-max-size=4096
      - --ws-ping-interval=20
      - --ws-ping-timeout=20
      - --timeout-graceful-shutdown=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8001/api/v1/health/', headers={'Host': 'backend'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    environment:
      # Exact https origin of the media CDN/bucket allowed in the CSP img-src (empty = same origin).
      MEDIA_CDN_ORIGIN: ${MEDIA_CDN_ORIGIN:-}
    ports:
      - "${WEB_PORT:-80}:8080"
    volumes:
      - nexus_media:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexus_pgdata:
  nexus_media:
