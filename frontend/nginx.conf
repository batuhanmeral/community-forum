# Social/search crawlers get server-rendered Open Graph pages from Django.
map $http_user_agent $is_og_bot {
    default 0;
    ~*(facebookexternalhit|twitterbot|slackbot|discordbot|whatsapp|telegrambot|linkedinbot|googlebot|bingbot|pinterestbot|redditbot) 1;
}

# The edge proxy must overwrite X-Forwarded-Proto; backend NUM_PROXIES = nginx (1) + every proxy in front of it.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
# WebSocket upgrade: keep the hop-by-hop headers the proxy would otherwise drop.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Realtime sockets per client address and in total; the realtime service adds its own caps
# (unauthenticated sockets per process, sockets per user). Behind another proxy, $remote_addr is
# that proxy: set up the realip module there before relying on the per-address cap.
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
limit_conn_zone $server_name zone=ws_total:1m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10M;

    include /etc/nginx/snippets/security-headers.conf;

    # Every upstream is resolved at request time via Docker's DNS: a recreated backend or realtime
    # container gets a new address, and a startup-time lookup would keep sending traffic to the
    # old one (502). proxy_pass therefore always takes a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    set $realtime_upstream http://realtime:8001;

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Proxy API + media to the Django backend (single-origin deployment).
    location /api/ {
        # No URI part: the client's request URI is passed on unchanged.
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Realtime event stream (uvicorn). Same origin, so CSP connect-src 'self' covers ws(s)://.
    location /ws/ {
        limit_conn ws_per_ip 30;
        limit_conn ws_total 1000;
        limit_conn_status 429;
        proxy_pass $realtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # uvicorn pings every 20 s and the client every 25 s; idle sockets stay well inside this.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # User-uploaded media served straight off the shared volume (Django does not
    # serve media with DEBUG=False). Swap for an S3/CDN origin in real prod.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Bot-facing OG pages for shareable routes; humans fall through to the SPA.
    location ~ ^/(posts/\d+|c/[\w-]+|u/[\w.@+-]+)/?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        if ($is_og_bot) {
            rewrite ^/(.*?)/?$ /og/$1/ break;
            # With a variable and no URI part, the rewritten URI is what gets proxied.
            proxy_pass $backend_upstream;
        }
        try_files $uri /index.html;
    }

    # SPA fallback: every other path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
