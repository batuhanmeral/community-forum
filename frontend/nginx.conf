# Social/search crawlers get server-rendered Open Graph pages from Django.
map $http_user_agent $is_og_bot {
    default 0;
    ~*(facebookexternalhit|twitterbot|slackbot|discordbot|whatsapp|telegrambot|linkedinbot|googlebot|bingbot|pinterestbot|redditbot) 1;
}

# The edge proxy must overwrite X-Forwarded-Proto; backend NUM_PROXIES = nginx (1) + every proxy in front of it.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10M;

    include /etc/nginx/snippets/security-headers.conf;

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Proxy API + media to the Django backend (single-origin deployment).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # User-uploaded media served straight off the shared volume (Django does not
    # serve media with DEBUG=False). Swap for an S3/CDN origin in real prod.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Bot-facing OG pages for shareable routes; humans fall through to the SPA.
    location ~ ^/(posts/\d+|c/[\w-]+|u/[\w.@+-]+)/?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        if ($is_og_bot) {
            rewrite ^/(.*?)/?$ /og/$1/ break;
            proxy_pass http://backend:8000;
        }
        try_files $uri /index.html;
    }

    # SPA fallback: every other path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
